apiVersion: batch/v1
kind: CronJob
metadata:
  name: dealer-export
spec:
  schedule: 30 18 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
          - name: dealer-export
            image: otc-dealer-export:0.1.0
            imagePullPolicy: IfNotPresent
            env:
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: INBOUND_BUCKET
              value: otc-inbound
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: source-credentials
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: source-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: SNAPSHOT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            - name: DEALER_DSN
              valueFrom:
                secretKeyRef:
                  name: source-credentials
                  key: DEALER_DSN
