apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-peer
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-peer
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:16.9
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: source-credentials
              key: POSTGRES_PASSWORD
        - name: COMMERCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: source-credentials
              key: COMMERCE_PASSWORD
        - name: DEALER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: source-credentials
              key: DEALER_PASSWORD
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
          periodSeconds: 5
        volumeMounts:
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: init
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
