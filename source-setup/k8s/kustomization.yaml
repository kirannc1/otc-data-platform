apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otc-sources
resources:
- namespace.yaml
- postgres.yaml
- kafka.yaml
- minio.yaml
- commerce.yaml
- dealer-export.yaml
configMapGenerator:
- name: postgres-init
  files:
  - postgres-init.sh
secretGenerator:
- name: source-credentials
  envs:
  - credentials.env
generatorOptions:
  disableNameSuffixHash: true
