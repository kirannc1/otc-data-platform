apiVersion: v1
kind: Service
metadata:
  name: commerce
spec:
  selector:
    app: commerce
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: commerce
  template:
    metadata:
      labels:
        app: commerce
    spec:
      automountServiceAccountToken: false
      containers:
      - name: commerce
        image: otc-commerce:0.1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: COMMERCE_DSN
          valueFrom:
            secretKeyRef:
              name: source-credentials
              key: COMMERCE_DSN
        readinessProbe:
          httpGet:
            port: 8000
            path: /health
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: outbox
  template:
    metadata:
      labels:
        app: outbox
    spec:
      automountServiceAccountToken: false
      containers:
      - name: outbox
        image: otc-commerce:0.1.0
        imagePullPolicy: IfNotPresent
        command:
        - python
        - main.py
        - publish
        env:
        - name: COMMERCE_DSN
          valueFrom:
            secretKeyRef:
              name: source-credentials
              key: COMMERCE_DSN
        - name: KAFKA_BOOTSTRAP
          value: kafka:9092
